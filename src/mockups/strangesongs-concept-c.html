<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strangesongs Concept C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fbfaf7;
      --ink: #121212;
      --muted: #666158;
      --line: rgba(18,18,18,0.12);
      --accent: #8b6b54;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.6rem clamp(1rem, 2.4vw, 3rem) 4rem;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(139,107,84,0.06), rgba(139,107,84,0.06)) 0 0 / 100% 1px no-repeat,
        linear-gradient(180deg, var(--paper), #f1ece3);
      font-family: "IBM Plex Mono", monospace;
    }
    .wrap { width: min(1120px, 100%); margin: 0 auto; }
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font: 700 clamp(2.3rem, 4vw, 3.8rem)/1 "Fraunces", serif;
      letter-spacing: -0.04em;
    }
    .subnav { color: var(--muted); font-size: 0.9rem; }
    .album-rail {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 1.2rem 0 0.3rem;
    }
    .pill {
      padding: 0.42rem 0.72rem;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255,255,255,0.45);
      white-space: nowrap;
    }
    .pill.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .gallery {
      margin-top: 1.5rem;
      column-count: 3;
      column-gap: 1.2rem;
    }
    .photo {
      break-inside: avoid;
      margin: 0 0 1.2rem;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, #ddd5ca, #cabfae);
    }
    .photo.t1 { aspect-ratio: 4 / 5; }
    .photo.t2 { aspect-ratio: 3 / 2; }
    .photo.t3 { aspect-ratio: 1 / 1; }
    .contact {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    .contact-grid {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: 2rem;
    }
    .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.78rem; }
    h2 { margin: 0.4rem 0 1rem; font: 700 clamp(1.8rem, 3vw, 2.7rem)/1 "Fraunces", serif; }
    .contact a { color: var(--ink); text-decoration: none; }
    .contact a:hover { color: var(--accent); }
    .row { padding: 0.7rem 0; border-bottom: 1px solid rgba(18,18,18,0.08); }
    @media (max-width: 800px) {
      .gallery { column-count: 2; }
      .contact-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .gallery { column-count: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="wordmark">what we see</div>
      <div class="subnav">photos / contact</div>
    </header>
    <div class="album-rail">
      <div class="pill active">all photos</div>
      <div class="pill">fall 2024</div>
      <div class="pill">brazil 2024</div>
      <div class="pill">sante fe</div>
      <div class="pill">ohio</div>
      <div class="pill">youngstown</div>
    </div>
    <section class="gallery">
      <div class="photo t1"></div>
      <div class="photo t2"></div>
      <div class="photo t3"></div>
      <div class="photo t2"></div>
      <div class="photo t1"></div>
      <div class="photo t3"></div>
    </section>
    <section class="contact">
      <div class="contact-grid">
        <div>
          <div class="label">contact</div>
          <h2>More index-card, less portfolio card.</h2>
        </div>
        <div>
          <div class="row">Email: <a href="#">jcrtll@protonmail.com</a></div>
          <div class="row">Writing / notes: <a href="#">strangesongs.github.io</a></div>
          <div class="row">Los Angeles, California</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
