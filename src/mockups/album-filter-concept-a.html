<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup A | Top Album Rail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f8f0e6;
      --ink: #1e1a16;
      --muted: #6a6257;
      --accent: #ff5a36;
      --line: rgba(30, 26, 22, 0.16);
      --card: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.4rem;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 90, 54, 0.2), transparent 34%),
        linear-gradient(155deg, #fff7ee, var(--paper));
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
    }

    .frame {
      max-width: 1220px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font: 700 clamp(2rem, 3vw, 2.8rem)/1 "Fraunces", serif;
      letter-spacing: -0.02em;
    }

    .hero {
      padding: 1.8rem 1.4rem 0.8rem;
    }

    .hero h1 {
      margin: 0;
      font: 700 clamp(2.4rem, 5vw, 4.8rem)/0.95 "Fraunces", serif;
      letter-spacing: -0.04em;
      max-width: 14ch;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      color: var(--muted);
    }

    .pill.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .gallery {
      padding: 1rem 1.4rem 1.4rem;
      column-count: 4;
      column-gap: 0.8rem;
    }

    .card {
      height: 170px;
      margin-bottom: 0.8rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #ded7cc, #c8beb1);
      border: 1px solid var(--line);
      break-inside: avoid;
      position: relative;
    }

    .card:nth-child(3n) { height: 220px; }
    .card:nth-child(4n) { height: 140px; }

    .label {
      position: absolute;
      left: 0.6rem;
      bottom: 0.6rem;
      font-size: 0.82rem;
      color: #fff;
      padding: 0.3rem 0.45rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
    }

    @media (max-width: 900px) { .gallery { column-count: 2; } }
    @media (max-width: 560px) { .gallery { column-count: 1; } }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="wordmark">what we see</div>
      <div class="pill">contact</div>
    </header>

    <section class="hero">
      <h1>Concept A: album rail across top.</h1>
      <div class="controls" aria-label="Albums">
        <div class="pill active">All photos</div>
        <div class="pill">Street</div>
        <div class="pill">Portraits</div>
        <div class="pill">Desert</div>
        <div class="pill">Studio</div>
        <div class="pill">+ tag input</div>
      </div>
    </section>

    <section class="gallery" aria-label="Mock gallery">
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
      <article class="card"><div class="label">Image tile</div></article>
    </section>
  </div>
</body>
</html>
