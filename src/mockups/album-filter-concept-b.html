<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup B | Album Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111417;
      --muted: #637078;
      --line: rgba(17, 20, 23, 0.14);
      --accent: #0e9b8a;
      --card: #f3f5f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 88% 14%, rgba(14, 155, 138, 0.23), transparent 42%),
        linear-gradient(145deg, #fcfefe, #eef3f6);
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      padding: 1.2rem;
    }

    .shell {
      max-width: 1220px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(7px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 1rem 1.2rem;
    }

    .wordmark {
      font: 700 clamp(2rem, 2.7vw, 2.7rem)/1 "Fraunces", serif;
      letter-spacing: -0.03em;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 72vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 1.1rem 0.9rem;
    }

    .sidebar h2 {
      margin: 0 0 0.8rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .album {
      padding: 0.6rem 0.7rem;
      border-radius: 10px;
      margin-bottom: 0.35rem;
      border: 1px solid transparent;
      color: var(--muted);
    }

    .album.active {
      border-color: transparent;
      color: #fff;
      background: var(--accent);
    }

    .content {
      padding: 1.2rem;
    }

    .content h1 {
      margin: 0 0 0.3rem;
      font: 700 clamp(2.1rem, 4vw, 3.8rem)/1 "Fraunces", serif;
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
    }

    .toolbar {
      margin-top: 1rem;
      display: flex;
      gap: 0.6rem;
    }

    .tool {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
      padding: 0.55rem 0.75rem;
    }

    .grid {
      margin-top: 1rem;
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .tile {
      height: 180px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, #d9e2e8, #c2ced7);
      position: relative;
      overflow: hidden;
    }

    .tile:nth-child(4n) { height: 260px; }
    .tile:nth-child(5n) { height: 130px; }

    .tile span {
      position: absolute;
      right: 0.5rem;
      bottom: 0.5rem;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.25rem 0.45rem;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark">what we see</div>
      <div>contact</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2>Albums</h2>
        <div class="album active">All photos</div>
        <div class="album">Street</div>
        <div class="album">Portraits</div>
        <div class="album">Desert</div>
        <div class="album">Studio</div>
      </aside>

      <main class="content">
        <h1>Concept B: album sidebar.</h1>
        <p class="sub">Tag search and image actions stay in a compact top toolbar.</p>
        <div class="toolbar">
          <div class="tool">Tag filter input</div>
          <div class="tool">Reset</div>
        </div>
        <section class="grid" aria-label="Mock gallery">
          <article class="tile"><span>Image tile</span></article>
          <article class="tile"><span>Image tile</span></article>
          <article class="tile"><span>Image tile</span></article>
          <article class="tile"><span>Image tile</span></article>
          <article class="tile"><span>Image tile</span></article>
          <article class="tile"><span>Image tile</span></article>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
